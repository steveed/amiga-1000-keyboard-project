services:
  kicad:
    image: kicad/kicad:10.0-full
    platform: linux/amd64
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /tmp
    working_dir: /repo
    volumes:
      - .:/repo

  tools:
    build: tools
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /repo
    volumes:
      - .:/repo

  openscad:
    build: case
    init: true   # xvfb-run hangs when it runs as PID 1
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /tmp
    working_dir: /repo
    volumes:
      - .:/repo
